# Basic auth for plausible.feedless.org.
#
# The previous traefik.ingress.kubernetes.io/auth-type|auth-secret|auth-realm
# annotations are Traefik v1 syntax and are silently ignored by v2/v3 - the host
# was served with no authentication at all. v2/v3 requires a BasicAuth Middleware.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: plausible-basic-auth
  # Must match the `default-` prefix in the router.middlewares annotation below.
  namespace: default
spec:
  basicAuth:
    secret: plausible-basic-auth
    realm: "Authentication Required"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plausible-ingress
  annotations:
    app.kubernetes.io/name: plausible-ingress
    cert-manager.io/cluster-issuer: letsencrypt
    # HTTP -> HTTPS is handled cluster-wide by ports.web.redirectTo in traefik.yaml.
    traefik.ingress.kubernetes.io/router.middlewares: default-plausible-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - plausible.feedless.org
      secretName: feedless-org-tls
  rules:
    - host: plausible.feedless.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plausible-service
                port:
                  number: 80
