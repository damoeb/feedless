apiVersion: v1
kind: Secret
metadata:
  name: plausible-basic-auth
  namespace: default
type: Opaque
data:
  # Traefik's BasicAuth middleware reads the `users` key (nginx-ingress uses `auth`).
  # Regenerate with: htpasswd -nb <user> <password> | base64
  users: "<generate: htpasswd -nb USER PASS | base64 -w0>"
