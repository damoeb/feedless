openapi: 3.0.3
info:
  title: Feedless HTTP API
  description: REST API for Feedless entities (auth, repository, source, document, harvest, plan, group).
  version: 1.0.0
servers:
  - url: /api/v1
    description: Feedless HTTP API v1
security:
  - userSecretJwt: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Authenticate with email + secretKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthUserRequest'
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: Current auth session
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Clear TOKEN cookie
      responses:
        '204':
          description: Logged out
components:
  securitySchemes:
    userSecretJwt:
      type: apiKey
      in: header
      name: Authentication
      description: Bearer JWT from login or UserSecret (logged-in user). Anonymous JWTs are rejected. Example `Bearer eyJ...`
  responses:
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        corrId: { type: string, description: Optional correlation id for support/debug }
        path: { type: string, description: Optional field or request path for validation errors }
    AuthUserRequest:
      type: object
      required: [email, secretKey]
      properties:
        email: { type: string, format: email }
        secretKey: { type: string }
    AuthenticationResponse:
      type: object
      required: [token, corrId]
      properties:
        token: { type: string }
        corrId: { type: string }
    SessionResponse:
      type: object
      required: [isAnonymous, isLoggedIn]
      properties:
        isAnonymous: { type: boolean }
        isLoggedIn: { type: boolean }
        userId: { type: string, format: uuid }
