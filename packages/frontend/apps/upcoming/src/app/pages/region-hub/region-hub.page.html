<ion-content>
  <main id="main-content" class="hub">
    <h1>Veranstaltungen im Kanton {{ region }}</h1>
    <p class="hub__intro">
      {{ places.length }} Orte im Kanton {{ region }}. Wähle einen Ort, um
      seine Veranstaltungen zu sehen.
    </p>
    <ul class="hub__list">
      @for (place of places; track place.place) {
        <li>
          <a [routerLink]="place.url">Veranstaltungen in {{ place.place }}</a>
        </li>
      }
    </ul>
    <p class="hub__back">
      <a routerLink="/events/in/CH">Alle Kantone</a>
    </p>
  </main>
  <app-upcoming-footer></app-upcoming-footer>
</ion-content>
