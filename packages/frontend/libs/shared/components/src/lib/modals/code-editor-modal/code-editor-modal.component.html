<ion-header>
  <ion-toolbar>
    <ion-title>{{ title }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">
        <app-icon name="close-outline"></app-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  @if (details?.length > 0) {
    <dl class="details ion-padding-horizontal">
      @for (detail of details; track detail.label) {
        <dt>{{ detail.label }}</dt>
        <dd>
          @if (detail.href) {
            <a [href]="detail.href" target="_blank" rel="noopener noreferrer">{{
              detail.value
            }}</a>
          } @else {
            {{ detail.value }}
          }
        </dd>
      }
    </dl>
  }
</ion-header>
<ion-content>
  <app-code-editor
    [contentType]="contentType"
    [readOnly]="readOnly"
    [text]="text"
  ></app-code-editor>
</ion-content>
