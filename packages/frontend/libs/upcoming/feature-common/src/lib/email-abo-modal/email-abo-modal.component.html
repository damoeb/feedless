<ion-header style="box-shadow: none">
  <ion-toolbar>
    <ion-title>Wöchentliches E-Mail-Abo</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()" aria-label="Schliessen">
        <app-icon name="close-outline"></app-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <p>
    Jede Woche die Veranstaltungen rund um
    <strong>{{ location?.displayName }}</strong> in deinem Postfach. Kostenlos
    und jederzeit abbestellbar.
  </p>
  <app-report-subscription-form (submitted)="subscribe($event)"></app-report-subscription-form>
</ion-content>
