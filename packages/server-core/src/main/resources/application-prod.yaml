spring:
  devtools:
    add-properties: false
  main:
    banner-mode: off
  # host/port/credentials/auth/starttls/test-connection live in
  # application-mail.yaml, which the `mail` profile activates after this one and
  # therefore wins. Only the timeouts are set here - they overlap with nothing.
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

logging:
  level:
    root: ${APP_LOG_LEVEL}
    ch:
      qos:
        logback: off

graphql:
  playground:
    enabled: false

app:
  apiGatewayUrl: ${APP_API_GATEWAY_URL}
  appHost: ${APP_HOST_URL}
  defaultDateFormat: ${APP_DEFAULT_DATE_FORMAT}  # dd-MM-yyyy
  defaultTimeFormat: ${APP_DEFAULT_TIME_FORMAT}  # HH:mm
  jwtSecret: ${APP_JWT_SECRET}
  rootEmail: ${APP_ROOT_EMAIL}
  rootSecretKey: ${APP_ROOT_SECRET_KEY}
  actuatorPassword: ${APP_ACTUATOR_PASSWORD}
  whitelistedHosts: ${APP_WHITELISTED_HOSTS}
  mail:
    sender: ${APP_MAIL_SENDER}
