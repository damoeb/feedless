spring:
  jpa:
    open-in-view: false
  jackson:
    # Jackson 3 sorts properties and rejects trailing tokens and null primitives; keep the Jackson 2 behaviour
    use-jackson2-defaults: true
  graphql:
    websocket:
      path: /subscriptions
      # DGS 9's default; Spring for GraphQL would wait 60s for connection_init
      connection-init-timeout: 10s
  web:
    resources:
      static-locations: file:./static
  main:
    banner-mode: off
  profiles:
    group:
      selfHosted: secrets,properties,license,security,session,features,document,attachment,user,repository,plan,source,legacy,browserautomation,feed,seed,cache,throttle,scrape,telegram,schedulerLayer,securityLayer,apiLayer,serviceLayer
      saas: secrets,report,properties,mail,stripe,license,security,session,features,document,annotation,attachment,user,metrics,repository,plan,source,legacy,analytics,sso,browserautomation,feed,seed,cache,throttle,scrape,database,telegram,order,schedulerLayer,securityLayer,apiLayer,serviceLayer,repositoryLayer

  task:
    scheduling:
      pool:
        size: 6

app:
  # aliases: each binds a legacy key or env var under the prefix of the properties class that reads it
  build:
    version: ${app.version}
    commit: ${APP_GIT_COMMIT:${app.git.commit:unknown}}
    timestamp: ${APP_BUILD_TIMESTAMP:}
  license:
    key: ${APP_LICENSE_KEY:}
    pem-file: ${APP_PEM_FILE:}
  privacy:
    blacklisted-domains: ${APP_BLACKLISTED_DOMAINS:}
  mail:
    mailgun-key: ${MAILGUN_KEY:}
  auth:
    anonymous-token-valid-for: ${auth.token.anonymous.validForDays:28}
    products:
      rssProxy:
        oauth: true
        mailToken: true
      untold:
        oauth: true
        mailToken: true
      feedless:
        oauth: true
      upcoming:
        oauth: true
      visual-diff:
        mailToken: true
        oauth: true
  version: dev
  # empty until BuildInfo replaces the @Value readers
  git:
    commit:

  report:
    # opt-out starts new subscriptions at once unless their address asked for opt-in; opt-in confirms every one
    subscription-mode: ${APP_REPORT_SUBSCRIPTION_MODE:opt-out}
    sender: ${app.mail.sender:feedless-sender@localhost}
  dateFormat: dd-MM-yyyy
  timeFormat: HH:mm
  timezone: UTC
  webToFeedVersion: 0.1
  defaultLocale: en
  cors:
    allowedOrigins: http://localhost:4200

default:
  auth:
    token:
      anonymous:
        validForDays: 28

auth:
  token:
    anonymous:
      validForDays: 28

logging:
  config: classpath:logback.xml
  level:
    root: ERROR
    com.netflix: ERROR
    org.hibernate.persister.entity.AbstractEntityPersister: ERROR
    # org.springframework.security: DEBUG
    # org.springframework.web: DEBUG

