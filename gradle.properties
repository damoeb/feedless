dockerImageTag=damoeb/feedless
feedlessVersion=0.3.0
user.timezone=UTC
# 512M is Gradle's default and server-core's kapt no longer fits in it: CI died with
# "daemon has been stopped: since the JVM garbage collector is thrashing".
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.caching=true
org.gradle.parallel=false
#org.gradle.configuration-cache=true
